name: Release candidate checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [22.22.2, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm audit --audit-level=low
      - run: pnpm package:release
      - run: pnpm smoke:release
      - run: pnpm package:vscode
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-evidence-${{ matrix.os }}-node${{ matrix.node }}
          path: |
            test-results/
            dist/release/
            dist/hunkyard-vscode-0.1.1.vsix
      - run: pnpm check:commit
        env:
          HUNKYARD_COMMIT_MESSAGE: ${{ github.event.pull_request.title || github.event.head_commit.message }}
